services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contenthub
      POSTGRES_USER: contenthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - contenthub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contenthub -d contenthub"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [private]
  app:
    build: .
    command: ["uvicorn", "hub.app:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://contenthub:${POSTGRES_PASSWORD}@db:5432/contenthub
    ports:
      - "${HUB_BIND:-127.0.0.1}:${HUB_PORT:-8787}:8080"
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [private]
  worker:
    build: .
    command: ["python", "-m", "hub.worker"]
    user: "1001:1001"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://contenthub:${POSTGRES_PASSWORD}@db:5432/contenthub
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    networks: [private]
networks:
  private:
    # No container ports are published except the internal web API.
    # Outbound access is needed for DeepL API and future Shopify integration.
    driver: bridge
volumes:
  contenthub_pgdata:
